# Catppuccin Mocha styles for tmux 3.4; load separately from the base config.
# Load on the host where the tmux server runs, not inside a container.
set-option -as terminal-features ',xterm-256color:RGB'
set-option -g status-style 'fg=#CDD6F4,bg=#181825'
set-option -g status-left-style 'fg=#89DCEB,bg=#181825,bold'
set-option -g status-right-style 'fg=#BAC2DE,bg=#181825'
set-option -g message-style 'fg=#CDD6F4,bg=#313244'
set-option -g message-command-style 'fg=#CDD6F4,bg=#313244'
set-option -g mode-style 'fg=#1E1E2E,bg=#89DCEB,bold'
set-window-option -g window-status-style 'fg=#A6ADC8,bg=#181825'
set-window-option -g window-status-current-style 'fg=#1E1E2E,bg=#89B4FA,bold'
set-window-option -g window-status-last-style 'fg=#1E1E2E,bg=#94E2D5'
set-window-option -g window-status-activity-style 'fg=#1E1E2E,bg=#F9E2AF,bold'
set-window-option -g window-status-bell-style 'fg=#1E1E2E,bg=#B4BEFE,bold'
set-window-option -g pane-border-style 'fg=#45475A'
set-window-option -g pane-active-border-style 'fg=#89B4FA'
set-window-option -g copy-mode-match-style 'fg=#1E1E2E,bg=#F9E2AF,bold'
set-window-option -g copy-mode-current-match-style 'fg=#1E1E2E,bg=#B4BEFE,bold'
set-window-option -g copy-mode-mark-style 'fg=#1E1E2E,bg=#89B4FA,bold'
