# Enable mouse support, including wheel scrolling through pane history.
set -g mouse on
set -g history-limit 100000

# Use xclip via copy-pipe; disable OSC 52 to avoid conflicting clipboard writes.
set -s set-clipboard off

# Ubuntu 24.04/original configuration: set the system clipboard command once
# for copy-pipe bindings. Replace DISPLAY/XAUTHORITY for the destination host.
set -s copy-command 'DISPLAY=:1 XAUTHORITY=/run/user/1000/gdm/Xauthority xclip -selection clipboard -i'

# Copy mouse selections directly to the system clipboard.
# Mouse reporting is per pane; always route drags to tmux copy mode, even when a TUI requested mouse input.
# Tradeoff: the application cannot use drag gestures; pane clicks and wheel behavior remain.
bind-key -T root MouseDrag1Pane copy-mode -M
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Convenient keyboard bindings in both copy-mode key tables.
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# BEGIN CODEX CATPPUCCIN MOCHA COLORS
set-option -as terminal-features ',xterm-256color:RGB'
set-option -g status-style 'fg=#CDD6F4,bg=#181825'
set-option -g status-left-style 'fg=#89DCEB,bg=#181825,bold'
set-option -g status-right-style 'fg=#BAC2DE,bg=#181825'
set-option -g message-style 'fg=#CDD6F4,bg=#313244'
set-option -g message-command-style 'fg=#CDD6F4,bg=#313244'
set-option -g mode-style 'fg=#1E1E2E,bg=#89DCEB,bold'
set-window-option -g window-status-style 'fg=#A6ADC8,bg=#181825'
set-window-option -g window-status-current-style 'fg=#1E1E2E,bg=#89B4FA,bold'
set-window-option -g window-status-last-style 'fg=#1E1E2E,bg=#94E2D5'
set-window-option -g window-status-activity-style 'fg=#1E1E2E,bg=#F9E2AF,bold'
set-window-option -g window-status-bell-style 'fg=#1E1E2E,bg=#B4BEFE,bold'
set-window-option -g pane-border-style 'fg=#45475A'
set-window-option -g pane-active-border-style 'fg=#89B4FA'
set-window-option -g copy-mode-match-style 'fg=#1E1E2E,bg=#F9E2AF,bold'
set-window-option -g copy-mode-current-match-style 'fg=#1E1E2E,bg=#B4BEFE,bold'
# END CODEX CATPPUCCIN MOCHA COLORS

# BEGIN CODEX CATPPUCCIN COPY MARK STYLE
set-window-option -g copy-mode-mark-style 'fg=#1E1E2E,bg=#89B4FA,bold'
# END CODEX CATPPUCCIN COPY MARK STYLE

# Save and restore sessions, windows, panes, names, layouts, and working dirs.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '60'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

# Load TPM plugins after their settings; the Continuum save override follows.
run '~/.tmux/plugins/tpm/tpm'

# Continuum's periodic saves use a low-priority wrapper; Ctrl-b Ctrl-s remains
# the plugin's normal-priority manual save binding.
set-option -gF @resurrect-save-script-path '#{E:HOME}/.local/bin/tmux-resurrect-save-low-priority'
